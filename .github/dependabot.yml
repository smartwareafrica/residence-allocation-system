version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
      all-other-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
