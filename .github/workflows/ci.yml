name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # re-audit weekly: new advisories appear without any code change
    - cron: '0 6 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run build
      - run: npm test
